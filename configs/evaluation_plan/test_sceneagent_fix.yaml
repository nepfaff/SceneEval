evaluation_cfg:
  metrics:
    - ArchitecturalWeldedEquilibriumMetricVHACD
  output_dir: ./output_eval
  save_blend_file: False
  save_trimesh_glb: False
  vlm: GPT
  use_existing_matching: True
  use_empty_matching_result: True
  support_metric_use_existing_support_type_assessment: False
  no_eval: False
  verbose: False

input_cfg:
  root_dir: ./input
  scene_methods:
    - SceneAgent
  method_use_simple_architecture: []
  scene_mode: list
  scene_range: [0, 1]
  scene_list: [0]
  annotation_file: ./input/annotations.csv

render_cfg:
  normal_render_tasks: []
  semantic_render_tasks: []
  semantic_color_reference: null
