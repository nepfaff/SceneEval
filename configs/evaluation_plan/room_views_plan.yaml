# Configuration for room views rendering and web GLB export
# Validates rendering of 9 room views (1 top + 8 side) with wall hiding
# and exports web-optimized GLB files

evaluation_cfg:
  metrics: []
  output_dir: ./output_eval/room_views_test
  save_blend_file: True
  save_trimesh_glb: False
  vlm: GPT
  use_existing_matching: True
  use_empty_matching_result: True
  support_metric_use_existing_support_type_assessment: False
  no_eval: True
  verbose: False

input_cfg:
  root_dir: ./input
  scene_methods:
    - Holodeck
  method_use_simple_architecture: []
  scene_mode: list
  scene_range: [0, 1]
  scene_list: [106]
  annotation_file: ./input/annotations.csv

render_cfg:
  normal_render_tasks:
    - room_views
  semantic_render_tasks: []
  semantic_color_reference: null
  # Room views and web GLB options
  export_web_glb: true
  web_glb_max_texture_size: 512
  hdri_path: ./input/hotel_room_1k.exr
